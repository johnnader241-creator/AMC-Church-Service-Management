services:
  - type: web
    name: church-service-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: church-service-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@church-service.local
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: WEB_THREADS
        value: "6"
      - key: WEB_CONNECTION_LIMIT
        value: "200"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_RECYCLE
        value: "1800"
      - key: DB_CONNECT_TIMEOUT
        value: "10"

databases:
  - name: church-service-db
    plan: free
    databaseName: church_service
    user: church_user
