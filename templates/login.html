<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6F1D2E"><title>تسجيل الدخول — إدارة الخدمة</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="loginbg"><div class="login-card"><img class="login-logo" src="{{ url_for('static',filename='logo-mark.svg') }}"><h1>إدارة الخدمة</h1><p class="sub">مركز افا موسي لتطوير التربيه الكنسيه</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>اسم المستخدم<input name="username" autocomplete="username" required autofocus></label><label>كلمة المرور<div class="password-wrap"><input id="pw" type="password" name="password" autocomplete="current-password" required><button type="button" onclick="pw.type=pw.type==='password'?'text':'password'" class="eye">◉</button></div></label><button class="btn primary wide" type="submit">دخول</button></form></div></body></html>
