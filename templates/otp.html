<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحقق OTP</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="loginbg"><div class="login-card"><img class="login-logo" src="{{url_for('static',filename='logo.png')}}"><h1>التحقق الأمني</h1><p class="sub">الشاشة: {{screen}}</p>{% if demo_code %}<div class="otp-demo">رمز الاختبار الحالي: <b>{{demo_code}}</b></div>{% else %}<div class="otp-demo">تم إرسال رمز التحقق عبر وسيلة التحقق المعتمدة.</div>{% endif %}<form method="post" action="{{url_for('web.otp_verify',screen=screen)}}"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{next}}"><label>رمز OTP<input inputmode="numeric" name="otp" maxlength="6" required autofocus></label><button class="btn primary wide">تحقق</button></form></div></body></html>
