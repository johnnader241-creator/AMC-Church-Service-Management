name: Expand deployment bundle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: ${{ hashFiles('deploy-bundle-v2/part-*') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild, verify and extract bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .bundle_tmp
          cat deploy-bundle-v2/part-* > .bundle_tmp/app.tar.xz
          echo "00fe22f7f9c222bedb30bfec89b9c2a5376e8c3d7fcb5dcce22e0f8d2f0b47bb  .bundle_tmp/app.tar.xz" | sha256sum -c -
          tar -xJf .bundle_tmp/app.tar.xz -C .
          rm -rf .bundle_tmp deploy-bundle-v2

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Expand production application bundle"
          git push
